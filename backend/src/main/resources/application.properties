spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:bus_booking}
spring.data.mongodb.auto-index-creation=true
server.port=${SERVER_PORT:8080}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}
payhere.merchant-id=${PAYHERE_MERCHANT_ID}
payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET}
payhere.sandbox=${PAYHERE_SANDBOX:true}
payhere.notify-url=${PAYHERE_NOTIFY_URL:http://localhost:8080/api/payments/notify}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:${spring.mail.username}}

otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}